  <script>
    const data=JSON.parse(document.getElementById('art-data').textContent);
    const ns='http://www.w3.org/2000/svg';
    const routes=[];
    for(const [name,art] of Object.entries(data)){
      const svg=document.getElementById(name);svg.setAttribute('viewBox','0 0 '+art.vb.join(' '));
      const source=document.createElementNS(ns,'image');source.setAttribute('href',art.original.src);source.setAttribute('width',art.original.width);source.setAttribute('height',art.original.height);source.setAttribute('transform',art.original.transform);source.setAttribute('class','source');svg.append(source);
      const paths={};
      for(const kind of ['future','ink','halo','pen']){
        const path=document.createElementNS(ns,'path');path.setAttribute('d',art.d);path.setAttribute('pathLength','1');path.setAttribute('class',kind);
        if(kind==='ink')path.setAttribute('stroke-dasharray','1');
        if(kind==='pen'||kind==='halo')path.setAttribute('stroke-dasharray','0 2');
        svg.append(path);paths[kind]=path;
      }
      function fit(){
        const box=svg.getBoundingClientRect(),scale=Math.min(box.width/art.vb[0],box.height/art.vb[1]);
        const x=(box.width-art.vb[0]*scale)/2,y=(box.height-art.vb[1]*scale)/2;
        svg.setAttribute('viewBox','0 0 '+box.width+' '+box.height);
        let coordinate=0;
        const placed=art.d.replace(/-?\d*\.?\d+/g,v=>String(Number(v)*scale+(coordinate++%2===0?x:y)));
        for(const path of Object.values(paths))path.setAttribute('d',placed);
        source.setAttribute('transform','translate('+x+' '+y+') scale('+scale+') '+art.original.transform);
      }
      new ResizeObserver(fit).observe(svg);fit();routes.push(paths);
    }
    const slider=document.getElementById('progress'),value=document.getElementById('value'),play=document.getElementById('play');
    let frame=0,position=100;
    function render(p){position=p;slider.value=p;value.value=p.toFixed(1)+'%';for(const r of routes){r.ink.setAttribute('stroke-dashoffset',1-p/100);r.pen.setAttribute('stroke-dashoffset',2-p/100);r.halo.setAttribute('stroke-dashoffset',2-p/100);}}
    function stop(){cancelAnimationFrame(frame);frame=0;play.textContent='Play trace';}
    slider.addEventListener('input',()=>{stop();render(Number(slider.value));});
    play.addEventListener('click',()=>{
      if(frame){stop();return;}
      if(position>=100)render(0);
      const initial=position,start=performance.now();play.textContent='Pause';
      function tick(now){const p=Math.min(100,initial+(now-start)/180);render(p);if(p<100)frame=requestAnimationFrame(tick);else stop();}
      frame=requestAnimationFrame(tick);
    });
    document.getElementById('reference').addEventListener('change',e=>document.body.classList.toggle('reference',e.target.checked));
    document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
    render(100);
  </script>
